# =====================================================================
# Job and postdoc search agent, working config (prefilled for Dr Saba Sadiq).
# Secrets are written as ${NAME} and come from environment variables or a .env
# file locally, and from GitHub Secrets when it runs in the cloud. Do NOT paste
# real keys into this file.
# =====================================================================

database:
  path: "data/agent.db"

notifications:
  email:
    enabled: true
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    username: "${EMAIL_USERNAME}"     # your Gmail address (a Secret)
    password: "${EMAIL_PASSWORD}"     # a Gmail App Password, not your login password (a Secret)
    from: "${EMAIL_USERNAME}"
    to: "you@example.com"             # CHANGE THIS to the inbox where you want alerts
  ntfy:
    enabled: false                    # set true to also get phone push notifications
    server: "https://ntfy.sh"
    topic: "saba-jobs-change-me-to-something-random"

gemini:
  enabled: true
  api_key: "${GEMINI_API_KEY}"        # free key from https://aistudio.google.com/apikey (a Secret)
  model: "gemini-2.5-flash-lite"      # free-tier friendly; "gemini-2.5-flash" also works
  relevance_threshold: 6              # only notify for postings scored this or higher (1-10)

adzuna:
  app_id: "${ADZUNA_APP_ID}"          # free from https://developer.adzuna.com/ (a Secret)
  app_key: "${ADZUNA_APP_KEY}"        # (a Secret)

profiles:
  - name: "saba_postdoc"
    posting_type: "both"              # "job", "postdoc", or "both"
    candidate_profile: >
      Dr Saba Sadiq, PhD in Biomolecular Sciences (2025, University of Campania
      Luigi Vanvitelli, Italy). Early-career researcher in food and microbial
      biotechnology. Expertise: microbial fermentation and functional foods;
      lactic acid bacteria (LAB) selection and characterization; probiotics and
      postbiotics; riboflavin and vitamin biofortification via fermentation;
      lactic acid production from lignocellulosic and food waste (valorization);
      fermented plant-based beverages; Bifidobacterium and Lactobacillus strains;
      exopolysaccharides; HPLC of organic acids, sugars and vitamins; spray
      drying; batch bioreactor design, monitoring and interpretation up to 3 L.
      NOT a fit: pure bioinformatics or metagenomics (NGS), machine learning or
      programming roles, pure plant pathology, pure clinical medicine, and pure
      analytical chemistry with no microbiology. Seeking a postdoc or fellowship
      and open to relocation across Europe and internationally.
    keywords:
      - "fermentation"
      - "lactic acid bacteria"
      - "probiotics"
      - "postbiotics"
      - "functional foods"
      - "food biotechnology"
      - "microbial biotechnology"
      - "valorization"
      - "lactic acid"
      - "biorefinery"
      - "exopolysaccharide"
      - "fermented foods"
      - "riboflavin"
      - "biofortification"
      - "gut microbiome"
    # Countries to search. Use a list of two-letter codes, or "any" for global.
    # Note: Adzuna only covers some countries (see README). EURAXESS and the
    # university pages cover the rest, including Sweden.
    countries: ["gb", "ie", "de", "nl", "se", "dk", "no", "fi", "ch", "be", "at", "fr", "es", "it"]
    adzuna_what: "fermentation microbiology functional food"
    euraxess_keywords: "fermentation probiotics food microbiology"
    university_pages:
      # These are EXAMPLES. Replace the URLs with real vacancy pages you care
      # about (ideally already filtered to your field). Add or remove freely.
      - name: "Lund University vacancies"
        url: "https://www.lunduniversity.lu.se/vacancies"
        country: "Sweden"
      - name: "Chalmers vacancies"
        url: "https://www.chalmers.se/en/about-chalmers/work-with-us/vacancies/"
        country: "Sweden"
